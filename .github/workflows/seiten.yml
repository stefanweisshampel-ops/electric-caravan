# Baut Autobahn-Seiten, Betreiberseiten, Ratgeber und Sitemap täglich mit den aktuellen Bewertungen neu
# und meldet geänderte Seiten per IndexNow an Bing.
name: Autobahn-Seiten aktualisieren

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/**', 'tools/build_pages.py', 'tools/ratgeber.html']

permissions:
  contents: write

concurrency:
  group: seiten
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Seiten bauen
        run: python3 tools/build_pages.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autobahn betreiber ratgeber sitemap.xml
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Autobahn-Seiten mit aktuellen Bewertungen"
          git pull --rebase origin main
          git push
          python3 tools/indexnow.py
