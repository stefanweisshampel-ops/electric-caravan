# Hält das kostenlose Supabase-Projekt wach (wird sonst nach 7 Tagen ohne Zugriffe pausiert).
# Liest Adresse und öffentlichen Schlüssel aus config.js und ruft alle drei Tage die Bewertungsstatistik ab.
name: Datenbank wach halten

on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bewertungsstatistik abrufen
        run: |
          node -e "
            global.window = {};
            require('./config.js');
            const c = window.GL_CONFIG || {};
            if (!c.supabaseUrl || !c.supabaseAnonKey) { console.log('Supabase ist noch nicht eingetragen – nichts zu tun.'); process.exit(0); }
            fetch(c.supabaseUrl.replace(/\/$/, '') + '/rest/v1/rpc/site_stats', {
              method: 'POST',
              headers: { apikey: c.supabaseAnonKey, 'Content-Type': 'application/json' },
              body: '{}'
            }).then(async (r) => {
              console.log('Antwort:', r.status);
              if (!r.ok) { console.log(await r.text()); process.exit(1); }
            }).catch((e) => { console.error(e); process.exit(1); });
          "
